<script>
  const petalsRoot = document.getElementById('petals');
  const PETAL_COUNT = 32;
  for(let i=0;i<PETAL_COUNT;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random()*100 + 'vw';
    const dur = 10 + Math.random()*12;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = (-Math.random()*dur) + 's';
    const size = 7 + Math.random()*10;
    p.style.width = size+'px';
    p.style.height = (size*1.15)+'px';
    p.style.setProperty('--drift', (Math.random()*240 - 120) + 'px');
    p.style.opacity = 0.35 + Math.random()*0.5;
    petalsRoot.appendChild(p);
  }

  const cursor = document.getElementById('cursor');
  let cx=0, cy=0, tx=0, ty=0;
  window.addEventListener('mousemove', e => { tx = e.clientX; ty = e.clientY; });
  (function loop(){
    cx += (tx - cx) * 0.18;
    cy += (ty - cy) * 0.18;
    cursor.style.transform = `translate(${cx}px, ${cy}px) translate(-50%,-50%)`;
    requestAnimationFrame(loop);
  })();
  document.querySelectorAll('.sword-btn, a, .brand-logo').forEach(el=>{
    el.addEventListener('mouseenter', ()=> cursor.classList.add('active'));
    el.addEventListener('mouseleave', ()=> cursor.classList.remove('active'));
  });

  document.querySelectorAll('.sword-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const flash = document.createElement('div');
      flash.style.cssText = `
        position:absolute; inset:0;
        background: linear-gradient(90deg, transparent, rgba(255,60,80,0.85), transparent);
        pointer-events:none;
        animation: slashFlash .6s ease-out forwards;
        z-index: 5;
      `;
      btn.appendChild(flash);
      setTimeout(()=> flash.remove(), 700);
    });
  });
  const slashStyle = document.createElement('style');
  slashStyle.textContent = `
    @keyframes slashFlash{
      0%   { transform: translateX(-100%); opacity:0; }
      50%  { opacity:1; }
      100% { transform: translateX(100%);  opacity:0; }
    }
  `;
  document.head.appendChild(slashStyle);
</script>
